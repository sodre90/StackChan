# Hungarian configuration for StackChan.
# Mounted as /app/config.yaml by the *.hu.yml compose files. Identical to config.yaml
# except for the language: Hungarian ASR, a multilingual TTS voice, and a Hungarian
# system prompt. Secrets (api_key, ha_token, OAuth tokens) still come from
# additional_config.yaml, which is overlaid on top of this file.

# OpenAI-compatible API base URL for LLM (used only when llm_provider is "openai")
api_base_url: "http://host.docker.internal:8000/v1"

# OpenAI-compatible API base URL for ASR (local faster-whisper server)
asr_base_url: "http://whisper:13000/v1"

llm_provider: "gemini"

# API key (set in additional_config.yaml)
api_key: ""

# ASR (Speech-to-Text) model name
asr_model: "whisper"

# LLM model name (gemini provider: the primary model)
llm_model: "gemini-3.1-flash-lite"

# Gemini fallback chain: tried in order after llm_model when the primary is
# rate-limited (HTTP 429) or unavailable (5xx). Each model has its own quota.
llm_fallback_models:
  - "gemini-3.5-flash"
  - "gemma-4-26b-a4b-it"
  - "gemma-4-31b-it"

# OpenAI-compatible API base URL for TTS (local edge-tts server)
tts_base_url: "http://tts:14000/v1"

# TTS via edge-tts. The multilingual voice speaks Hungarian for Hungarian text and
# switches to native English for embedded English fragments (e.g. meeting titles).
tts_model: "edge"
tts_voice: "en-US-AvaMultilingualNeural"
tts_response_format: "opus"

# System prompt (Hungarian)
system_prompt: >
  You are StackChan, a cute AI desktop robot built on M5Stack CoreS3.
  You have a screen with expressive eyes and a mouth.
  Be friendly, helpful, and concise. Keep responses VERY short — 1-2 sentences, under 30 words.
  Responses are spoken aloud so brevity is essential. Use a warm, playful tone.
  Never use emojis or special characters. Always respond in Hungarian.
  You are connected to Home Assistant and can control smart home devices.
  IMPORTANT: You MUST always call the appropriate tool to control devices.
  NEVER just say you did something without actually calling home.turn_on, home.turn_off, or home.call_script.
  If you already know the entity_id from context, skip home.get_entities and call the action tool directly.
  When unsure which entity to use, search multiple domains (light, switch, cover, lock, script) with home.get_entities.

# Enable ASR (local Whisper server)
enable_asr: true

# Enable TTS
enable_tts: true

# Conversation context
context_messages: 10

# LLM streaming
stream_llm: true

# ASR (Whisper) language hint. The *.hu.yml stack runs the Hungarian-tuned model.
asr_language: "hu"

# ASR initial prompt: disabled — the Hungarian base model collapses to "." outputs
# when given a long priming prompt. Re-enable only for larger Whisper models.
asr_initial_prompt: ""

# VAD (Voice Activity Detection) settings
vad_silence_timeout_ms: 2000
vad_ticker_interval_ms: 100
vad_rms_threshold: 0.01

# WebSocket port (0 = use main server port)
ws_port: 0

# Enable MCP tools
enable_mcp_tools: true

# Home Assistant integration (set ha_token in additional_config.yaml)
ha_url: "http://192.168.2.166:8123"

# Google Calendar integration. Reminders are announced in Hungarian.
google_calendar_id: "primary"
google_calendar_announce_minutes: 10
google_calendar_reminder_minutes: [30, 10, 1]
