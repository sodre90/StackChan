# StackChan — Hungarian variant (Docker Compose).
#
#   docker compose -f docker-compose.hu.yml up --build
#
# Same as docker-compose.yml but uses the Hungarian-tuned Whisper model
# (whisper/Dockerfile.cpu.hu) and the Hungarian config (config.hu.yaml).
# It binds the same ports (12800/13000/14000), so run EITHER this OR the default
# English stack — not both.
services:
  stackchan:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "12800:12800"
    volumes:
      - ./config.hu.yaml:/app/config.yaml:ro
      - ./additional_config.yaml:/app/additional_config.yaml:ro
    depends_on:
      - whisper
      - tts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  whisper:
    build:
      context: .
      dockerfile: whisper/Dockerfile.cpu.hu
    image: stackchan-whisper-hu
    ports:
      - "13000:13000"
    volumes:
      - whisper-models:/root/.cache/huggingface
    restart: unless-stopped

  tts:
    build:
      context: .
      dockerfile: tts/Dockerfile
    ports:
      - "14000:14000"
    restart: unless-stopped

volumes:
  whisper-models:
