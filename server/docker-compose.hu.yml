# StackChan — Hungarian variant (Docker Compose).
#
#   podman-compose -f docker-compose.hu.yml up -d --build
#
# Same as docker-compose.yml but uses the Hungarian-tuned Whisper model on the GPU
# (whisper/Dockerfile.hu.cuda — sarpba/whisper-base-hungarian_v1, CUDA int8_float16,
# ~355 MB VRAM, ~120 ms/utterance) and the Hungarian config (config.hu.yaml).
# It binds the same ports (12800/13000/14000), so run EITHER this OR the default
# English stack — not both.
services:
  stackchan:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "12800:12800"
    volumes:
      - ./config.hu.yaml:/app/config.yaml:ro
      - ./additional_config.yaml:/app/additional_config.yaml:ro
    depends_on:
      - whisper
      - tts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  whisper:
    build:
      context: .
      dockerfile: whisper/Dockerfile.hu.cuda
    image: stackchan-whisper-hu-cuda
    ports:
      - "13000:13000"
    devices:
      - "nvidia.com/gpu=all"
    security_opt:
      - "label=disable"
    volumes:
      - whisper-models:/root/.cache/huggingface
      - whisper-ct2:/root/.cache/ct2_models
    restart: unless-stopped

  tts:
    build:
      context: .
      dockerfile: tts/Dockerfile
    ports:
      - "14000:14000"
    restart: unless-stopped

volumes:
  whisper-models:
  whisper-ct2:
