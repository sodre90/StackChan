services:
  stackchan:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "12800:12800"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./additional_config.yaml:/app/additional_config.yaml:ro
    depends_on:
      - whisper
      - tts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  whisper:
    build:
      context: .
      dockerfile: whisper/Dockerfile.cpu
    image: stackchan-whisper-en
    ports:
      - "13000:13000"
    volumes:
      - whisper-models:/root/.cache/huggingface
    restart: unless-stopped

  tts:
    build:
      context: .
      # edge-tts (Microsoft) — voice-driven, multilingual. For local Piper, use
      # piper/Dockerfile instead and set a Piper voice in config.yaml.
      dockerfile: tts/Dockerfile
    ports:
      - "14000:14000"
    restart: unless-stopped

volumes:
  whisper-models:
